name: Build Android + Windows

on:
  push:
    paths-ignore:
      - "mirror/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # SWIG нужен CMake-скрипту OpenVPN for Android
      - name: Install SWIG
        run: sudo apt-get update -qq && sudo apt-get install -y -qq swig

      - uses: gradle/actions/setup-gradle@v4
        with:
          # В подмодуле ics-openvpn лежит свой gradle-wrapper.jar, который мы не используем
          validate-wrappers: false

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests '*VpnGateParserTest'

      - name: Build APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo "Подпись: постоянный ключ"
          else
            echo "::warning::Секрет ANDROID_KEYSTORE_B64 не задан — APK подписан временным ключом, обновление поверх старой версии не сработает"
          fi
          ./gradlew :app:assembleRelease

      # Скриншоты экранов (Robolectric) — для проверки дизайна
      - name: Screenshots
        continue-on-error: true
        run: ./gradlew :app:recordRoborazziDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ProXvpn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ProXvpn.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-shots
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: ignore

  # Windows-версия (Compose Desktop): установщик MSI и переносная ZIP-версия
  windows:
    runs-on: windows-latest
    env:
      DESKTOP_ONLY: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      # драйвер виртуального адаптера для своего SSTP (https://www.wintun.net, подписан WireGuard LLC)
      - name: Download Wintun
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
          (Get-FileHash wintun.zip -Algorithm SHA256).Hash
          Expand-Archive wintun.zip -DestinationPath wintun-tmp
          $dll = "wintun-tmp/wintun/bin/amd64/wintun.dll"
          $sig = Get-AuthenticodeSignature $dll
          "$($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'WireGuard LLC') { throw "wintun.dll signature check failed" }
          Copy-Item $dll desktop/resources/windows/wintun.dll

      - name: Tests and screenshots
        run: ./gradlew :desktop:test

      # свой SSTP-клиент против настоящих серверов VPN Gate (только согласование PPP, без адаптера)
      - name: Live SSTP test
        continue-on-error: true
        env:
          SSTP_LIVE_TEST: "1"
        run: ./gradlew :desktop:test --tests '*SstpLiveTest*' --rerun -i 2>&1 | grep -E "^\s*(---|  |Серверов|Успешно|.*FAILED)" || true

      # полный туннель на сборщике: адаптер Wintun, маршруты, запрос через VPN
      - name: Live tunnel test
        continue-on-error: true
        timeout-minutes: 6
        env:
          SSTP_TUNNEL_TEST: "1"
        run: ./gradlew :desktop:test --tests '*SstpTunnelLiveTest*' --rerun

      - name: Build MSI and portable app
        run: ./gradlew :desktop:packageReleaseMsi :desktop:createReleaseDistributable

      # запускаем собранную программу: она должна открыть окно и сама выйти с кодом 0
      - name: Smoke test
        shell: pwsh
        env:
          VPNGATE_SMOKE_TEST: "1"
        run: |
          $exe = "desktop/build/compose/binaries/main-release/app/ProXvpn/ProXvpn.exe"
          $p = Start-Process -FilePath $exe -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "app did not exit in 60 s" }
          if ($p.ExitCode -ne 0) { throw "app exit code $($p.ExitCode)" }
          "smoke test OK"

      - name: Show packaging logs
        if: failure()
        run: cat desktop/build/compose/logs/*/*.txt || true

      - name: Collect files
        run: |
          mkdir -p dist
          cp desktop/build/compose/binaries/main-release/msi/*.msi "dist/ProXvpn-Windows.msi"
          cd desktop/build/compose/binaries/main-release/app
          7z a -tzip "$GITHUB_WORKSPACE/dist/ProXvpn-Windows-portable.zip" "ProXvpn" > /dev/null
          ls -la "$GITHUB_WORKSPACE/dist"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-shots
          path: desktop/build/screenshots/*.png
          if-no-files-found: ignore

  # Публикует всё в Releases: https://github.com/<owner>/<repo>/releases/latest
  publish:
    needs: [build, windows]
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: art

      - name: Update manifest (version.json)
        run: |
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          WV=$(grep -oP 'val appVersion = "\K[^"]+' desktop/build.gradle.kts)
          APK=art/apk/ProXvpn.apk
          MSI=art/windows/ProXvpn-Windows.msi
          NOTES=$(git log -1 --pretty=%s)
          python3 - "$VC" "$VN" "$WV" "$NOTES" <<'PY'
          import json, os, sys
          vc, vn, wv, notes = sys.argv[1:5]
          m = {"build": int(os.environ["GITHUB_RUN_NUMBER"]), "notes": notes}
          if os.path.exists("art/apk/ProXvpn.apk"):
              m["android"] = {"versionCode": int(vc), "versionName": vn, "file": "ProXvpn.apk",
                              "size": os.path.getsize("art/apk/ProXvpn.apk")}
          if os.path.exists("art/windows/ProXvpn-Windows.msi"):
              m["windows"] = {"version": wv, "file": "ProXvpn-Windows.msi",
                              "size": os.path.getsize("art/windows/ProXvpn-Windows.msi")}
          json.dump(m, open("version.json", "w"), ensure_ascii=False, indent=1)
          PY
          cat version.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          FILES="art/apk/ProXvpn.apk version.json"
          NOTES="Автоматическая сборка из коммита ${GITHUB_SHA::7}.
          • ProXvpn.apk — Android
          • ProXvpn-Windows.msi — установщик для Windows 10/11
          • ProXvpn-Windows-portable.zip — Windows без установки (запуск: ProXvpn.exe)"
          if [ -d art/windows ]; then FILES="$FILES art/windows/*"; else NOTES="$NOTES
          (Windows-сборка в этот раз не удалась)"; fi
          gh release create "$TAG" $FILES \
            --title "ProXvpn (сборка ${{ github.run_number }})" \
            --notes "$NOTES" --latest

      - name: Publish screenshots
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          SHOTS=(art/android-shots/*.png art/windows-shots/*.png)
          [ ${#SHOTS[@]} -gt 0 ] || exit 0
          gh release delete screenshots -y --cleanup-tag || true
          gh release create screenshots "${SHOTS[@]}" \
            --title "Скриншоты экранов" --notes "Автоматически из ScreenshotTest" \
            --prerelease --latest=false
