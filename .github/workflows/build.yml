name: Build APK

on:
  push:
    paths-ignore:
      - "mirror/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # SWIG нужен CMake-скрипту OpenVPN for Android
      - name: Install SWIG
        run: sudo apt-get update -qq && sudo apt-get install -y -qq swig

      - uses: gradle/actions/setup-gradle@v4
        with:
          # В подмодуле ics-openvpn лежит свой gradle-wrapper.jar, который мы не используем
          validate-wrappers: false

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --tests '*VpnGateParserTest'

      - name: Build APK
        run: ./gradlew :app:assembleRelease

      # Скриншоты экранов (Robolectric) — для проверки дизайна
      - name: Screenshots
        continue-on-error: true
        run: ./gradlew :app:recordRoborazziDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk VpnGateClient.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VpnGateClient-apk
          path: VpnGateClient.apk

      # Публикует APK в Releases: https://github.com/<owner>/<repo>/releases/latest
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" VpnGateClient.apk \
            --title "VPN Gate Client (сборка ${{ github.run_number }})" \
            --notes "Автоматическая сборка из коммита ${GITHUB_SHA::7}. VPN встроен в приложение." \
            --latest

      - name: Publish screenshots
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls app/build/outputs/roborazzi/*.png || exit 0
          gh release delete screenshots -y --cleanup-tag || true
          gh release create screenshots app/build/outputs/roborazzi/*.png \
            --title "Скриншоты экранов" --notes "Автоматически из ScreenshotTest" \
            --prerelease --latest=false
